name: Test Tenon

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  core-and-oss-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run Rust core tests
        run: ./scripts/test.sh core

      - name: Build tenon-oss binary
        run: ./build.sh tenon-oss
