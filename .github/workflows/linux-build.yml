name: Linux Release Build

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  test-linux:
    name: Test Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run Rust core tests
        run: ./scripts/test.sh core

      - name: Build tenon-oss binary
        run: ./build.sh tenon-oss

  build-linux-artifacts:
    name: Build Linux ${{ matrix.arch }} Artifacts
    needs: test-linux
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            image: quay.io/pypa/manylinux_2_28_x86_64
            wheel_tag: manylinux_2_28_x86_64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            image: quay.io/pypa/manylinux_2_28_aarch64
            wheel_tag: manylinux_2_28_aarch64
    env:
      TENON_WHEEL_PLATFORM_TAG: ${{ matrix.wheel_tag }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install system build tools
        run: |
          dnf install -y gcc gcc-c++ make cmake findutils which tar gzip zip

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python packaging dependencies
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Build Linux ${{ matrix.arch }} binary and PyPI wheel
        run: |
          chmod +x build.sh
          export TENON_VERSION="${GITHUB_REF_NAME#v}"
          ./build.sh tenon-oss-pypi

      - name: Verify build outputs
        run: |
          ls -1 build/tenon-oss-*
          ls -1 build/tenon_oss-*.whl

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tenon-linux-${{ matrix.arch }}-release-artifacts
          path: |
            build/tenon-oss-*
            build/tenon_oss-*.whl
          if-no-files-found: error

      - name: Upload assets to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/tenon-oss-*
            build/tenon_oss-*.whl
