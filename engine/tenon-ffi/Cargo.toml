[package]
name = "tenon-ffi"
version = "0.1.0"
edition = "2021"

[lib]
name = "tenon_embed"
crate-type = ["cdylib", "rlib"]

[dependencies]
tenon-core = { path = "../tenon-core" }
tenon-coordinator = { path = "../tenon-coordinator" }
libc = "0.2"
serde_json = "1.0"
log = "0.4"
flume = "0.11"

[features]
mqtt = ["tenon-core/mqtt"]
simd-json = ["tenon-core/simd-json"]
