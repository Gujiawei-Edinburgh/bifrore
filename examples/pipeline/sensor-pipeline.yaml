apiVersion: tenon.apache.org/v1alpha1
kind: MqttSource
metadata:
  name: sensor-mqtt-edge
spec:
  broker:
    host: 127.0.0.1
    port: 1883
  clientCount: 2
  auth:
    script:
      runtime: lua
      source: |
        function credentials(ctx)
          return {
            type = "username-password",
            username = "dev",
            password = "dev"
          }
        end
  subscriptions:
    - topic: sensor/+/data
      decode: json
---
apiVersion: tenon.apache.org/v1alpha1
kind: MqttSource
metadata:
  name: sensor-mqtt-cloud
spec:
  broker:
    host: 127.0.0.1
    port: 1884
  clientCount: 1
  auth:
    script:
      runtime: lua
      source: |
        function credentials(ctx)
          return {
            type = "username-password",
            username = "dev",
            password = "dev"
          }
        end
  subscriptions:
    - topic: factory/+/sensor/+/data
      decode: json
---
apiVersion: tenon.apache.org/v1alpha1
kind: Process
metadata:
  name: sensor-process
spec:
  runtime: lua
  source: |
    function on_message(ctx, msg)
      local payload = msg.payload

      if payload.temp == nil or payload.temp <= 30 then
        return
      end

      local batch = ctx.memory:get("batch") or {}
      batch[#batch + 1] = {
        source = msg.source.name,
        topic = msg.topic.raw,
        device = msg.topic[2],
        temp = payload.temp,
        hum = payload.hum,
        qos = msg.metadata.qos
      }

      if #batch < 100 then
        ctx.memory:set("batch", batch)
        return
      end

      ctx.emit({
        count = #batch,
        items = batch
      })
      ctx.memory:delete("batch")
    end
---
apiVersion: tenon.apache.org/v1alpha1
kind: Egress
metadata:
  name: sensor-batches
spec:
  delivery: single
---
apiVersion: tenon.apache.org/v1alpha1
kind: Pipeline
metadata:
  name: sensor-ingest
spec:
  execution:
    mode: intra-proc
  sourceRefs:
    - kind: MqttSource
      name: sensor-mqtt-edge
    - kind: MqttSource
      name: sensor-mqtt-cloud
  processRef:
    kind: Process
    name: sensor-process
  egressRef:
    kind: Egress
    name: sensor-batches
