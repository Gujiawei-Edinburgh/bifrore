apiVersion: tenon.apache.org/v1alpha1
kind: MqttSource
metadata:
  name: sensor-mqtt-edge
  version: v1
spec:
  broker:
    host: 127.0.0.1
    port: 1883
  auth:
    module:
      runtime: lua
      source: |
        function credentials(ctx)
          return {
            type = "username-password",
            username = "dev",
            password = "dev"
          }
        end
  subscriptions:
    - topic: sensor/+/data
      decode: json
---
apiVersion: tenon.apache.org/v1alpha1
kind: MqttSource
metadata:
  name: sensor-mqtt-cloud
  version: v1
spec:
  broker:
    host: 127.0.0.1
    port: 1884
  auth:
    module:
      runtime: lua
      source: |
        function credentials(ctx)
          return {
            type = "username-password",
            username = "dev",
            password = "dev"
          }
        end
  subscriptions:
    - topic: factory/+/sensor/+/data
      decode: json
---
apiVersion: tenon.apache.org/v1alpha1
kind: Module
metadata:
  name: sensor-processor
  version: v1
spec:
  runtime: lua
  source: |
    function on_message(ctx, msg)
      local payload = msg.payload

      if payload.temp == nil or payload.temp <= 30 then
        return
      end

      local batch = ctx.state:get("batch") or {}
      batch[#batch + 1] = {
        source = msg.source.name,
        topic = msg.topic.raw,
        device = msg.topic[2],
        temp = payload.temp,
        hum = payload.hum,
        qos = msg.metadata.qos
      }

      if #batch < 100 then
        ctx.state:set("batch", batch)
        return
      end

      ctx.emit("sensor-batches", {
        count = #batch,
        items = batch
      })
      ctx.state:delete("batch")
    end
---
apiVersion: tenon.apache.org/v1alpha1
kind: Egress
metadata:
  name: sensor-batches
  version: v1
spec:
  channel: sensor-batches
---
apiVersion: tenon.apache.org/v1alpha1
kind: Process
metadata:
  name: sensor-process
  version: v1
spec:
  moduleRef:
    name: sensor-processor
    version: v1
---
apiVersion: tenon.apache.org/v1alpha1
kind: Pipeline
metadata:
  name: sensor-ingest
  version: v1
spec:
  execution:
    mode: intra-proc
  sourceRefs:
    - kind: MqttSource
      name: sensor-mqtt-edge
      version: v1
    - kind: MqttSource
      name: sensor-mqtt-cloud
      version: v1
  processRef:
    kind: Process
    name: sensor-process
    version: v1
  egressRef:
    kind: Egress
    name: sensor-batches
    version: v1
