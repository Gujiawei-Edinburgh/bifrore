apiVersion: tenon.apache.org/v1alpha1
kind: MqttSource
metadata:
  name: sensor-mqtt
  version: v1
spec:
  broker:
    host: 127.0.0.1
    port: 1883
  auth:
    script:
      inline: |
        function credentials(ctx)
          return {
            username = "dev",
            password = "dev"
          }
        end
  subscriptions:
    - topic: sensor/+/data
      decode: json
---
apiVersion: tenon.apache.org/v1alpha1
kind: Script
metadata:
  name: sensor-processor
  version: v1
spec:
  runtime: lua
  entry: main.lua
  files:
    main.lua: |
      function on_message(ctx, msg)
        local payload = msg.payload

        if payload.temp == nil or payload.temp <= 30 then
          return
        end

        local batch = ctx.state:get("batch") or {}
        batch[#batch + 1] = {
          topic = msg.topic.raw,
          device = msg.topic[2],
          temp = payload.temp,
          hum = payload.hum,
          qos = msg.metadata.qos
        }

        if #batch < 100 then
          ctx.state:set("batch", batch)
          return
        end

        ctx.emit("sensor-batches", {
          count = #batch,
          items = batch
        })
        ctx.state:delete("batch")
      end
---
apiVersion: tenon.apache.org/v1alpha1
kind: IpcEgress
metadata:
  name: sensor-batches
  version: v1
spec:
  channels:
    - sensor-batches
---
apiVersion: tenon.apache.org/v1alpha1
kind: Process
metadata:
  name: sensor-process
  version: v1
spec:
  runtime: script
  scriptRef:
    name: sensor-processor
    version: v1
    entry: main.lua
---
apiVersion: tenon.apache.org/v1alpha1
kind: Pipeline
metadata:
  name: sensor-ingest
  version: v1
spec:
  execution:
    mode: intra-proc
  sourceRef:
    kind: MqttSource
    name: sensor-mqtt
    version: v1
  processRef:
    kind: Process
    name: sensor-process
    version: v1
  egressRef:
    kind: IpcEgress
    name: sensor-batches
    version: v1
