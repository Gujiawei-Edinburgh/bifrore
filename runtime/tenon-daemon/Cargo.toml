[package]
name = "tenon-daemon"
version = "0.1.0"
edition = "2021"

[dependencies]
futures = "0.3"
libc = "0.2"
prost = "0.14"
tenon-message = { path = "../tenon-message" }
tenon-transport = { path = "../tenon-transport" }
tokio = { version = "1.35", features = ["io-util", "net", "rt", "sync", "time"] }
wait-timeout = "0.2"

[dev-dependencies]
tenon-transport = { path = "../tenon-transport", features = ["test-support"] }
