apiVersion: tenon.apache.org/v1alpha1
kind: MqttSource
metadata:
  name: source
spec:
  broker:
    host: 127.0.0.1
    port: 1883
  subscriptions:
    - topic: data
      decode: json
---
apiVersion: tenon.apache.org/v1alpha1
kind: Egress
metadata:
  name: egress
---
apiVersion: tenon.apache.org/v1alpha1
kind: Pipeline
metadata:
  name: pipeline
spec:
  execution:
    mode: intra-proc
  sourceRefs:
    - kind: MqttSource
      name: source
  processRef:
    kind: Process
    name: missing-process
  egressRef:
    kind: Egress
    name: egress
