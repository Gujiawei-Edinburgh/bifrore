apiVersion: tenon.apache.org/v1alpha1
kind: MqttSource
metadata:
  name: source
  version: v1
spec:
  broker:
    host: 127.0.0.1
    port: 1883
  subscriptions:
    - topic: data
      decode: json
---
apiVersion: tenon.apache.org/v1alpha1
kind: Process
metadata:
  name: process
  version: v1
spec:
  runtime: lua
  source: |
    function on_message(ctx, msg)
      ctx.emit(msg.payload)
    end
---
apiVersion: tenon.apache.org/v1alpha1
kind: Egress
metadata:
  name: egress
  version: v1
spec:
  delivery: shared
---
apiVersion: tenon.apache.org/v1alpha1
kind: Pipeline
metadata:
  name: pipeline
  version: v1
spec:
  execution:
    mode: intra-proc
  sourceRefs:
    - kind: MqttSource
      name: source
      version: v1
  processRef:
    kind: Process
    name: process
    version: v1
  egressRef:
    kind: Egress
    name: egress
    version: v1
