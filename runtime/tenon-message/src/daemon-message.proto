syntax = "proto3";

package tenon.daemon.v1;

message ResourceId {
  ResourceKind kind = 1;
  string name = 2;
  string version = 3;
}

enum ResourceKind {
  RESOURCE_KIND_UNSPECIFIED = 0;
  RESOURCE_KIND_MQTT_SOURCE = 1;
  RESOURCE_KIND_EGRESS = 3;
  RESOURCE_KIND_PROCESS = 4;
  RESOURCE_KIND_PIPELINE = 5;
}

message DeploymentPlan {
  ResourceId id = 1;
  ExecutionMode execution = 2;
  repeated MqttSourcePlan sources = 3;
  ProcessPlan process = 4;
  EgressPlan egress = 5;
}

message StoredDeploymentPlan {
  ResourceId id = 1;
  ExecutionMode execution = 2;
  repeated ResourceId source_refs = 3;
  ResourceId process_ref = 4;
  ResourceId egress_ref = 5;
}

message Resource {
  oneof kind {
    DeploymentPlan pipeline = 1;
    MqttSourcePlan mqtt_source = 2;
    ProcessPlan process = 3;
    EgressPlan egress = 4;
  }
}

message PutPipelineRequest {
  DeploymentPlan pipeline = 1;
}

message PutPipelineResponse {
  bool accepted = 1;
  ResourceId id = 2;
  ApplyMode mode = 3;
  string message = 4;
  repeated ResourceId resource_ids = 5;
}

message ApplyResourceRequest {
  optional string pipeline_ver = 1;
}

message ApplyResourceResponse {
  bool accepted = 1;
  ResourceId active_pipeline_id = 2;
  ApplyMode mode = 3;
  string message = 4;
}

message GetResourceRequest {
  ResourceId id = 1;
}

message GetResourceResponse {
  bool found = 1;
  Resource resource = 2;
  string message = 3;
}

message ReviseResourceRequest {
  ResourceId pipeline_id = 1;
  ResourceId previous_resource_id = 2;
  Resource new_resource = 3;
}

message ReviseResourceResponse {
  bool accepted = 1;
  ResourceId revised_pipeline_id = 2;
  string message = 3;
  ResourceId revised_resource_id = 4;
  repeated ResourceId resource_ids = 5;
}

message DeleteResourceRequest {
  ResourceId id = 1;
}

message DeleteResourceResponse {
  bool deleted = 1;
  string message = 2;
}

enum ApplyMode {
  APPLY_MODE_UNSPECIFIED = 0;
  APPLY_MODE_STARTED = 1;
  APPLY_MODE_HOT_RELOAD = 2;
  APPLY_MODE_REJECTED_RESTART_REQUIRED = 3;
  APPLY_MODE_REJECTED_WORKER_ERROR = 4;
}

enum ExecutionMode {
  EXECUTION_MODE_UNSPECIFIED = 0;
  EXECUTION_MODE_INTRA_PROC = 1;
}

message MqttSourcePlan {
  ResourceId id = 1;
  MqttBrokerPlan broker = 2;
  AuthPlan auth = 3;
  repeated MqttSubscriptionPlan subscriptions = 4;
  uint32 client_count = 5;
}

message MqttClientIds {
  repeated string client_ids = 1;
}

message ResourceReferences {
  repeated ResourceId pipeline_refs = 1;
}

message MqttBrokerPlan {
  string host = 1;
  uint32 port = 2;
}

message AuthPlan {
  oneof kind {
    NoAuth none = 1;
    UsernamePasswordAuth username_password = 2;
    ScriptModule script = 3;
  }
}

message NoAuth {}

message UsernamePasswordAuth {
  string username = 1;
  string password = 2;
}

message MqttSubscriptionPlan {
  string topic = 1;
  PayloadDecodePlan decode = 2;
}

enum PayloadDecodePlan {
  PAYLOAD_DECODE_PLAN_UNSPECIFIED = 0;
  PAYLOAD_DECODE_PLAN_JSON = 1;
}

message ProcessPlan {
  ResourceId id = 1;
  ScriptRuntime runtime = 2;
  string source = 3;
}

message ScriptModule {
  ScriptRuntime runtime = 1;
  string source = 2;
}

enum ScriptRuntime {
  SCRIPT_RUNTIME_UNSPECIFIED = 0;
  SCRIPT_RUNTIME_LUA = 1;
}

message EgressPlan {
  ResourceId id = 1;
  DeliveryMode delivery = 2;
}

enum DeliveryMode {
  DELIVERY_MODE_UNSPECIFIED = 0;
  DELIVERY_MODE_SINGLE = 1;
  DELIVERY_MODE_BROADCAST = 2;
}

message StartWorkerRequest {
  DeploymentPlan plan = 1;
}

message WorkerEnvelope {
  oneof payload {
    StartWorkerRequest start_worker = 1;
    Heartbeat heartbeat = 2;
  }
}

message Heartbeat {
  uint64 timestamp_millis = 1;
}

message DaemonEnvelope {
  oneof payload {
    PutPipelineRequest put_pipeline = 3;
    PutPipelineResponse put_pipeline_response = 4;
    GetResourceRequest get_resource = 7;
    GetResourceResponse get_resource_response = 8;
    ReviseResourceRequest revise_resource = 9;
    ReviseResourceResponse revise_resource_response = 10;
    DeleteResourceRequest delete_resource = 11;
    DeleteResourceResponse delete_resource_response = 12;
    ApplyResourceRequest apply_resource = 13;
    ApplyResourceResponse apply_resource_response = 14;
  }
}
