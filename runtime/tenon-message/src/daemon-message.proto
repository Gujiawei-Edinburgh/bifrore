syntax = "proto3";

package tenon.daemon.v1;

message ResourceId {
  string name = 1;
  string version = 2;
}

message DeploymentPlan {
  ResourceId id = 1;
  ExecutionMode execution = 2;
  repeated MqttSourcePlan sources = 3;
  ProcessPlan process = 4;
  EgressPlan egress = 5;
}

message Resource {
  oneof kind {
    DeploymentPlan pipeline = 1;
    MqttSourcePlan mqtt_source = 2;
    ProcessPlan process = 3;
    EgressPlan egress = 4;
  }
}

message PutPipelineRequest {
  DeploymentPlan pipeline = 1;
}

message PutPipelineResponse {
  bool accepted = 1;
  ResourceId id = 2;
  ApplyMode mode = 3;
  string message = 4;
}

message ApplyResourceRequest {
  string pipeline_name = 1;
  optional string pipeline_ver = 2;
}

message ApplyResourceResponse {
  bool accepted = 1;
  ResourceId active_pipeline_id = 2;
  ApplyMode mode = 3;
  string message = 4;
}

enum ApplyMode {
  APPLY_MODE_UNSPECIFIED = 0;
  APPLY_MODE_STARTED = 1;
  APPLY_MODE_HOT_RELOAD = 2;
  APPLY_MODE_REJECTED_RESTART_REQUIRED = 3;
  APPLY_MODE_REJECTED_WORKER_ERROR = 4;
}

enum ExecutionMode {
  EXECUTION_MODE_UNSPECIFIED = 0;
  EXECUTION_MODE_INTRA_PROC = 1;
}

message MqttSourcePlan {
  MqttBrokerPlan broker = 1;
  AuthPlan auth = 2;
  repeated MqttSubscriptionPlan subscriptions = 3;
  uint32 client_count = 4;
}

message MqttClientIds {
  repeated string client_ids = 1;
}

message MqttSourceClientIds {
  uint32 source_index = 1;
  repeated string client_ids = 2;
}

message MqttBrokerPlan {
  string host = 1;
  uint32 port = 2;
}

message AuthPlan {
  reserved 2;
  oneof kind {
    NoAuth none = 1;
    ScriptModule script = 3;
  }
}

message NoAuth {}

message MqttSubscriptionPlan {
  string topic = 1;
  PayloadDecodePlan decode = 2;
}

enum PayloadDecodePlan {
  PAYLOAD_DECODE_PLAN_UNSPECIFIED = 0;
  PAYLOAD_DECODE_PLAN_JSON = 1;
}

enum AccessMode {
  ACCESS_MODE_UNSPECIFIED = 0;
  // The namespace is not needed by the process script.
  ACCESS_MODE_NONE = 1;
  // Only the explicitly listed fields/paths/ranges are needed.
  ACCESS_MODE_SELECTIVE = 2;
  // The access is dynamic or whole-object, so the full namespace is needed.
  ACCESS_MODE_FULL = 3;
}

message MessageAccessPlan {
  SourceAccess source = 1;
  TopicAccess topic = 2;
  JsonAccess payload = 3;
  RawPayloadAccess raw_payload = 4;
  MetadataAccess metadata = 5;
  PropertiesAccess properties = 6;
}

message SourceAccess {
  AccessMode mode = 1;
  bool name = 2;
  bool version = 3;
}

message TopicAccess {
  AccessMode mode = 1;
  bool raw = 2;
  bool levels = 3;
  // Lua-facing topic level indexes are 1-based.
  repeated uint32 level_indexes = 4;
}

message RawPayloadAccess {
  AccessMode mode = 1;
  repeated ByteRange ranges = 2;
}

message ByteRange {
  uint32 offset = 1;
  uint32 length = 2;
}

message JsonAccess {
  AccessMode mode = 1;
  repeated JsonPath paths = 2;
}

message JsonPath {
  repeated JsonPathSegment segments = 1;
}

message JsonPathSegment {
  oneof kind {
    string field = 1;
    uint32 index = 2;
  }
}

message MetadataAccess {
  AccessMode mode = 1;
  bool pkid = 2;
  bool qos = 3;
  bool retain = 4;
  bool dup = 5;
}

message PropertiesAccess {
  AccessMode mode = 1;
  repeated string keys = 2;
}

message ProcessPlan {
  ScriptRuntime runtime = 1;
  string source = 2;
  MessageAccessPlan access_plan = 3;
}

message ScriptModule {
  ScriptRuntime runtime = 1;
  string source = 2;
}

enum ScriptRuntime {
  SCRIPT_RUNTIME_UNSPECIFIED = 0;
  SCRIPT_RUNTIME_LUA = 1;
}

message EgressPlan {}

message StartWorkerRequest {
  DeploymentPlan plan = 1;
  repeated MqttSourceClientIds source_client_ids = 2;
}

message ReloadWorkerRequest {
  DeploymentPlan plan = 1;
}

message StopWorkerRequest {}

message StartWorkerResponse {
  WorkerState state = 1;
  string error = 2;
}

message ReloadWorkerResponse {
  WorkerState state = 1;
  string error = 2;
}

message StopWorkerResponse {
  WorkerState state = 1;
  string error = 2;
}

enum WorkerState {
  WORKER_STATE_UNSPECIFIED = 0;
  WORKER_STATE_INIT = 1;
  WORKER_STATE_STARTING = 2;
  WORKER_STATE_RUNNING = 3;
  WORKER_STATE_STOPPING = 4;
  WORKER_STATE_STOPPED = 5;
  WORKER_STATE_ERROR = 6;
}

message GetWorkerStatsRequest {}

message GetWorkerStatsResponse {
  WorkerStats stats = 1;
  string error = 2;
}

message WorkerStats {
  uint64 processed_messages = 1;
  uint64 processor_errors = 2;
  uint64 emitted_records = 3;
  uint64 egress_enqueued_records = 4;
  uint64 egress_delivered_records = 5;
  uint64 egress_dropped_records = 6;
  uint64 egress_dropped_queue_full_records = 7;
  uint64 egress_dropped_stopped_records = 8;
  uint64 egress_dropped_no_consumer_records = 9;
  uint64 egress_dropped_slow_consumer_records = 10;
  uint64 egress_dropped_incomplete_frame_records = 11;
  uint64 egress_dropped_oversized_records = 12;
  uint64 egress_dropped_encode_error_records = 13;
}

message WorkerEnvelope {
  oneof payload {
    StartWorkerRequest start_worker = 1;
    Heartbeat heartbeat = 2;
    ReloadWorkerRequest reload_worker = 3;
    StopWorkerRequest stop_worker = 4;
    GetWorkerStatsRequest get_worker_stats = 5;
  }
}

message WorkerResponseEnvelope {
  oneof payload {
    GetWorkerStatsResponse worker_stats = 1;
    StartWorkerResponse start_worker = 2;
    ReloadWorkerResponse reload_worker = 3;
    StopWorkerResponse stop_worker = 4;
  }
}

message Heartbeat {
  uint64 timestamp_millis = 1;
}

message DaemonEnvelope {
  oneof payload {
    PutPipelineRequest put_pipeline = 3;
    PutPipelineResponse put_pipeline_response = 4;
    ApplyResourceRequest apply_resource = 13;
    ApplyResourceResponse apply_resource_response = 14;
  }
}
