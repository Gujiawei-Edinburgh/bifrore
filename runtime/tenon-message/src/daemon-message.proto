syntax = "proto3";

package tenon.daemon.v1;

message ResourceId {
  ResourceKind kind = 1;
  string name = 2;
  string version = 3;
}

enum ResourceKind {
  RESOURCE_KIND_UNSPECIFIED = 0;
  RESOURCE_KIND_MQTT_SOURCE = 1;
  RESOURCE_KIND_MODULE = 2;
  RESOURCE_KIND_EGRESS = 3;
  RESOURCE_KIND_PROCESS = 4;
  RESOURCE_KIND_PIPELINE = 5;
}

message DeploymentPlan {
  ResourceId id = 1;
  ExecutionMode execution = 2;
  repeated MqttSourcePlan sources = 3;
  ProcessPlan process = 4;
  EgressPlan egress = 5;
}

message StoredDeploymentPlan {
  ResourceId id = 1;
  ExecutionMode execution = 2;
  repeated ResourceId source_refs = 3;
  ResourceId process_ref = 4;
  ResourceId egress_ref = 5;
}

message ApplyDeploymentRequest {
  DeploymentPlan plan = 1;
}

message ApplyDeploymentResponse {
  bool accepted = 1;
  ResourceId active_plan = 2;
  ApplyMode mode = 3;
  string message = 4;
}

enum ApplyMode {
  APPLY_MODE_UNSPECIFIED = 0;
  APPLY_MODE_STARTED = 1;
  APPLY_MODE_HOT_RELOAD = 2;
  APPLY_MODE_REJECTED_RESTART_REQUIRED = 3;
  APPLY_MODE_REJECTED_WORKER_ERROR = 4;
}

message DeploymentUpdate {
  ResourceId from_plan = 1;
  ResourceId to_plan = 2;
  oneof update {
    ProcessUpdate process = 3;
  }
}

message DeploymentUpdateResponse {
  bool accepted = 1;
  ResourceId active_plan = 2;
  ApplyMode mode = 3;
  string message = 4;
}

message ProcessUpdate {
  ProcessPlan process = 1;
}

enum ExecutionMode {
  EXECUTION_MODE_UNSPECIFIED = 0;
  EXECUTION_MODE_INTRA_PROC = 1;
}

message MqttSourcePlan {
  ResourceId id = 1;
  MqttBrokerPlan broker = 2;
  AuthPlan auth = 3;
  repeated MqttSubscriptionPlan subscriptions = 4;
  uint32 client_count = 5;
}

message MqttClientIds {
  repeated string client_ids = 1;
}

message MqttBrokerPlan {
  string host = 1;
  uint32 port = 2;
}

message AuthPlan {
  oneof kind {
    NoAuth none = 1;
    UsernamePasswordAuth username_password = 2;
    ModulePlan module = 3;
  }
}

message NoAuth {}

message UsernamePasswordAuth {
  string username = 1;
  string password = 2;
}

message MqttSubscriptionPlan {
  string topic = 1;
  PayloadDecodePlan decode = 2;
}

enum PayloadDecodePlan {
  PAYLOAD_DECODE_PLAN_UNSPECIFIED = 0;
  PAYLOAD_DECODE_PLAN_JSON = 1;
}

message ProcessPlan {
  ResourceId id = 1;
  ModulePlan module = 2;
}

message ModulePlan {
  ResourceId id = 1;
  ModuleRuntime runtime = 2;
  string source = 3;
}

enum ModuleRuntime {
  MODULE_RUNTIME_UNSPECIFIED = 0;
  MODULE_RUNTIME_LUA = 1;
}

message EgressPlan {
  ResourceId id = 1;
  DeliveryMode delivery = 2;
}

enum DeliveryMode {
  DELIVERY_MODE_UNSPECIFIED = 0;
  DELIVERY_MODE_SINGLE = 1;
  DELIVERY_MODE_BROADCAST = 2;
}

message StartWorkerRequest {
  DeploymentPlan plan = 1;
}

message WorkerEnvelope {
  oneof payload {
    StartWorkerRequest start_worker = 1;
    Heartbeat heartbeat = 2;
  }
}

message Heartbeat {
  uint64 timestamp_millis = 1;
}

message DaemonEnvelope {
  oneof payload {
    ApplyDeploymentRequest apply_deployment = 3;
    ApplyDeploymentResponse apply_deployment_response = 4;
    DeploymentUpdate deployment_update = 5;
    DeploymentUpdateResponse deployment_update_response = 6;
  }
}
