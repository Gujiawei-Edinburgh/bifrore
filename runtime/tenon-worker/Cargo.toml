[package]
name = "tenon-worker"
version = "0.1.0"
edition = "2021"

[dependencies]
flume = "0.11"
log = "0.4"
mlua = { version = "0.10", features = ["lua54", "vendored", "send"] }
mio = { version = "1.0", features = ["net", "os-ext", "os-poll"] }
prost = "0.14"
rumqttc = "0.24"
serde_json = "1.0"
tenon-extension = { path = "../tenon-extension" }
tenon-message = { path = "../tenon-message" }
tokio = { version = "1.35", features = ["rt-multi-thread", "macros", "time", "sync"] }
